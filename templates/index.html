<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados — Ticket Promedio por Tienda</title>
</head>
<body>
    <h1>Ticket Promedio por Tienda</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Tienda</th>
                <th>Ticket Promedio ($)</th>
            </tr>
        </thead>
        <tbody>
            {% for row in resultados %}
            <tr>
                <td>{{ row.tienda }}</td>
                <td>{{ row.ticket_promedio }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2">No hay datos procesados disponibles.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
